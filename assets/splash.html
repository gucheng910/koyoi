<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Koyoi</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #0D0C0A;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden;
    font-family: -apple-system, 'Noto Serif SC', 'Georgia', serif;
    -webkit-font-smoothing: antialiased;
  }

  #stage {
    width: 280px; height: 280px;
    position: relative;
  }

  /* ── Book pages ── */
  .page {
    position: absolute;
    background: #E8DCC8;
    border-radius: 2px;
    transform-origin: left center;
    opacity: 0;
  }
  .page-left {
    left: 50%; top: 50%;
    width: 3px; height: 90px;
    margin-top: -45px;
    animation: pageReveal 1200ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    animation-delay: 200ms;
  }
  .page-right {
    left: calc(50% + 3px); top: 50%;
    width: 60px; height: 90px;
    margin-top: -45px;
    background: linear-gradient(90deg, #E8DCC8 0%, #C8BFA0 100%);
    transform-origin: left center;
    transform: scaleX(0);
    animation: pageOpen 800ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    animation-delay: 600ms;
  }

  @keyframes pageReveal {
    0%   { opacity: 0; transform: scaleY(0.3); }
    40%  { opacity: 1; }
    100% { opacity: 1; transform: scaleY(1); }
  }
  @keyframes pageOpen {
    0%   { transform: scaleX(0); }
    100% { transform: scaleX(1); }
  }

  /* ── Ink dot ── */
  .ink-dot {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #5B9BD5;
    opacity: 0;
    animation: inkDrop 600ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    animation-delay: 1000ms;
  }
  .ink-dot-1 { left: calc(50% - 20px); top: calc(50% + 30px); animation-delay: 1000ms; }
  .ink-dot-2 { left: calc(50% + 4px);  top: calc(50% + 20px); animation-delay: 1080ms; }
  .ink-dot-3 { left: calc(50% + 28px); top: calc(50% + 35px); animation-delay: 1160ms; }

  @keyframes inkDrop {
    0%   { opacity: 0; transform: translateY(-20px) scale(0); }
    60%  { opacity: 1; transform: translateY(2px) scale(1.3); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Wordmark ── */
  .wordmark {
    position: absolute;
    width: 100%; text-align: center;
    top: calc(50% + 70px);
    opacity: 0;
    transform: translateY(8px);
    animation: wordRise 800ms cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    animation-delay: 1400ms;
  }
  .wordmark-text {
    font-size: 36px; font-weight: 300;
    color: #E8DCC8; letter-spacing: 12px;
    margin-right: -12px;
  }
  .wordmark-sub {
    font-size: 10px; color: #8A8070; letter-spacing: 6px;
    margin-top: 6px; text-transform: uppercase;
  }

  @keyframes wordRise {
    0%   { opacity: 0; transform: translateY(12px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ── Subtle ring ── */
  .ring {
    position: absolute;
    left: 50%; top: 50%;
    width: 120px; height: 120px;
    margin-left: -60px; margin-top: -60px;
    border: 1px solid rgba(91, 155, 213, 0.15);
    border-radius: 50%;
    opacity: 0;
    animation: ringPulse 2000ms ease-out forwards;
    animation-delay: 400ms;
  }
  @keyframes ringPulse {
    0%   { opacity: 0; transform: scale(0.8); }
    50%  { opacity: 0.6; }
    100% { opacity: 0; transform: scale(1.4); }
  }

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    .page-left, .page-right, .ink-dot, .wordmark, .ring {
      animation: none; opacity: 1;
    }
    .page-right { transform: scaleX(1); }
    .ink-dot { transform: translateY(0) scale(1); }
    .wordmark { transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="ring"></div>
  <div class="page-left"></div>
  <div class="page-right"></div>
  <div class="ink-dot ink-dot-1"></div>
  <div class="ink-dot ink-dot-2"></div>
  <div class="ink-dot ink-dot-3"></div>
  <div class="wordmark">
    <div class="wordmark-text">Koyoi</div>
    <div class="wordmark-sub">Interactive Fiction</div>
  </div>
</div>

</body>
</html>
