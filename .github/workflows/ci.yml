name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 类型检查是本项目最重要的门禁：notableEvents 类型漂移曾让谣言系统
      # 静默失效，而 jest 只剥离类型不做检查，唯一能拦住它的是 tsc。
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci --coverage
